# Copy this file to .streamlit/secrets.toml (local) or paste into
# Streamlit Community Cloud > App settings > Secrets (deployed).
# The real secrets.toml is listed in .gitignore and is never uploaded to GitHub.

# Free key from https://finnhub.io/register
FINNHUB_API_KEY = "your-finnhub-key"

# The SEC requires a name and contact email in every request.
SEC_USER_AGENT = "Your Name your.email@example.com"
